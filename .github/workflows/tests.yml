name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 resolves an older xraylarch (the current one needs 3.11+)
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e . pytest
      - name: Show versions
        run: python -m pip show xraylarch mcp | grep -E "^(Name|Version)"
      - name: Test
        run: python -m pytest -q
