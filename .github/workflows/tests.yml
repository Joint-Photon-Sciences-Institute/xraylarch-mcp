name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # publish.yml runs the tests before uploading

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest Python that pyproject.toml allows, and the newest
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e . pytest
      - name: Show versions
        run: python -m pip show xraylarch mcp | grep -E "^(Name|Version)"
      - name: Test
        run: python -m pytest -q
